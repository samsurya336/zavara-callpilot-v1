# Render Blueprint for Zavara CallPilot: the marketing site and the client console.
# Dashboard: New + > Blueprint > pick this repository. Render reads this file and creates both services.
# Docs: https://render.com/docs/blueprint-spec
#
# The backend (database, auth, storage, edge functions) is a hosted Supabase project, not a Render
# service. Create it at https://supabase.com, push the migrations and functions from /supabase, and
# paste its URL and publishable key into the console's environment below.
services:
  # ---------------------------------------------------------------------------------------------
  # Marketing site: plain HTML/CSS/JS. tools/build.mjs copies it to dist/ and bakes APP_URL into
  # js/config.js so every "Get started" button links to the console.
  # ---------------------------------------------------------------------------------------------
  - type: web
    name: callpilot-marketing
    runtime: static
    rootDir: apps/marketing-site
    buildCommand: node tools/build.mjs
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Public address of the client console below, e.g. https://callpilot-console.onrender.com
      - key: APP_URL
        sync: false
    headers:
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # config.js changes with APP_URL on every deploy, so it must never be cached long-term.
      - path: /js/config.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate

  # ---------------------------------------------------------------------------------------------
  # Client console: React 19 + Vite single-page app, run as a Node web service.
  # The build produces dist/; the start command serves it with SPA fallback (every unknown path
  # returns index.html so React Router handles /dashboard, /sign-in, ... on refresh).
  # ---------------------------------------------------------------------------------------------
  - type: web
    name: callpilot-console
    runtime: node
    plan: free
    rootDir: apps/client-console
    # NODE_ENV=development applies to the install step only. Render sets NODE_ENV=production, which
    # would make pnpm skip the devDependencies (vite, typescript) the build needs. Vite still emits
    # a production build.
    buildCommand: NODE_ENV=development corepack pnpm install --frozen-lockfile && corepack pnpm build
    # `serve -s` = single-page-app mode. Pinned version, fetched into pnpm's cache at boot.
    # Swap for `node server.mjs` if a dependency-free in-repo server is added later.
    startCommand: corepack pnpm dlx serve@14.2.4 -s dist -l $PORT
    healthCheckPath: /
    envVars:
      # Node 22 line, as required by package.json "engines".
      - key: NODE_VERSION
        value: 22.19.0
      # Hosted Supabase project: Project Settings > API. The publishable (anon) key is safe in the
      # browser. Never put the service-role or secret key in a VITE_* variable.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
