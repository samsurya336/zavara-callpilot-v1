# Render Blueprint for the CallPilot marketing site.
# Dashboard: New + > Blueprint > pick this repository. Render reads this file and creates the service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: callpilot-marketing
    runtime: static
    rootDir: apps/marketing-site
    buildCommand: node tools/build.mjs
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Address of the CallPilot application. Every "Get started" button links here.
      # sync: false means Render asks for the value in the dashboard instead of reading it from git.
      - key: APP_URL
        sync: false
    headers:
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
