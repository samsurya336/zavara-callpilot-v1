# Render Blueprint for Zavara CallPilot: the marketing site and the client console.
# Dashboard: New + > Blueprint > pick this repository. Render reads this file and creates both services.
# Docs: https://render.com/docs/blueprint-spec
#
# The backend (database, auth, storage, edge functions) is a hosted Supabase project, not a Render
# service. Create it at https://supabase.com, push the migrations and functions from /supabase, and
# paste its URL and publishable key into the console's environment below.
services:
  # ---------------------------------------------------------------------------------------------
  # Marketing site: plain HTML/CSS/JS. tools/build.mjs copies it to dist/ and bakes APP_URL into
  # js/config.js so every "Get started" button links to the console.
  # ---------------------------------------------------------------------------------------------
  - type: web
    name: callpilot-marketing
    runtime: static
    rootDir: apps/marketing-site
    buildCommand: node tools/build.mjs
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Public address of the client console below, e.g. https://callpilot-console.onrender.com
      - key: APP_URL
        sync: false
    headers:
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate

  # ---------------------------------------------------------------------------------------------
  # Client console: React 19 + Vite single-page app. Built with the pinned pnpm via Corepack.
  # Routes are handled in the browser (React Router), so every path is rewritten to index.html.
  # ---------------------------------------------------------------------------------------------
  - type: web
    name: callpilot-console
    runtime: static
    rootDir: apps/client-console
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Node 22 line, as required by package.json "engines".
      - key: NODE_VERSION
        value: 22.19.0
      # Hosted Supabase project: Project Settings > API. The publishable (anon) key is safe in the
      # browser. Never put the service-role or secret key in a VITE_* variable.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite emits content-hashed filenames under /assets, so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
