project_id = "client-console"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seeds/challenges.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
enable_confirmations = false
secure_password_change = false

[auth.sms]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
enabled = true

[functions.list-users-organizations]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.elevenlabs-agent-session]
verify_jwt = false
import_map = "./functions/deno.json"

# Called by ElevenLabs, authenticated by its HMAC signature instead of a user session.
[functions.elevenlabs-post-call]
verify_jwt = false
import_map = "./functions/deno.json"
